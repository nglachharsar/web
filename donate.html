<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <title>दान करें - नंदी गौशाला</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-main text-light">

    <header class="bg-main/95 shadow-lg sticky top-0 z-50 border-b border-custom">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3"><img src="ngl.svg" class="h-12 w-12 bg-white rounded-full p-1" onerror="this.src='ngl.png'"><h1 class="text-xl font-bold text-gold">नंदी गौशाला</h1></a>
            <a href="index.html" class="text-sm font-bold bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700">← होम</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-16">
        <h2 class="text-4xl font-bold text-gold mb-8 text-center">दान करें</h2>
        
        <div class="bg-card p-8 rounded-2xl border border-custom text-center mb-8 shadow-lg">
            <!-- QR Code Link to UPI App -->
            <a href="upi://pay?pa=9216626445@upi&pn=NANDI%20GO%20SEWA%20SANSTHAN%20LACHHARSAR&cu=INR" class="inline-block relative group cursor-pointer">
                <img src="qrngl.jpeg" class="w-56 h-56 mx-auto rounded-xl border-4 border-gray-700 shadow-md group-hover:scale-105 transition" onerror="this.src='ngl.png'">
            </a>
            <p class="text-lg font-bold text-gold mt-4">UPI ID: 9216626445@upi</p>
            <p class="text-sm text-gray-400">QR कोड स्कैन करें या तस्वीर पर क्लिक करें</p>
            <p class="text-sm text-gray-400 mt-1">खाता धारक: NANDI GO SEWA SANSTHAN LACHHARSAR</p>
        </div>

        <form id="donationForm" class="bg-card p-8 rounded-2xl border border-custom space-y-4">
            <input type="text" id="donorName" placeholder="आपका नाम" required class="w-full bg-gray-800 border border-gray-600 p-3 rounded-lg text-white outline-none focus:border-gold">
            <input type="number" id="donationAmount" placeholder="राशि (₹)" required class="w-full bg-gray-800 border border-gray-600 p-3 rounded-lg text-white outline-none focus:border-gold">
            <textarea id="donationMessage" placeholder="संदेश (वैकल्पिक)" rows="2" class="w-full bg-gray-800 border border-gray-600 p-3 rounded-lg text-white outline-none focus:border-gold"></textarea>
            <button type="submit" class="w-full bg-accent text-white font-bold py-3 rounded-lg hover:bg-orange-700">दान दर्ज करें & रसीद पाएं</button>
        </form>
        <p id="formStatus" class="text-center font-bold mt-4 hidden"></p>
    </main>

    <div id="receipt-template" class="hidden" style="width: 800px; padding: 40px; background: #fff; color:#000;">
        <h1 style="color: #2d6a4f; text-align:center;">नंदी गौशाला, लछारसर</h1>
        <h2 style="text-align:center;">दान प्रमाण पत्र</h2>
        <p><strong>नाम:</strong> <span id="receipt-name"></span></p>
        <p><strong>राशि:</strong> ₹<span id="receipt-amount"></span></p>
        <p><strong>संदेश:</strong> <span id="receipt-message"></span></p>
        <p><strong>दिनांक:</strong> <span id="receipt-date"></span></p>
    </div>

    <footer class="bg-gray-950 py-6 text-center mt-10 border-t border-gray-800"><p>© 2025 नंदी गौशाला</p></footer>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="donate.js"></script>
</body>
</html>
