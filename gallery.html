<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गैलरी - नंदी गौशाला लछारसर</title>
    <meta name="description" content="नंदी गौशाला, लछारसर की सुंदर तस्वीरें और झलकियां।">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Lightbox (फोटो बड़ा करने का स्टाइल) */
        #lightbox {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        #lightbox img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            object-fit: contain;
        }
        #lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: color 0.3s;
        }
        #lightbox .close-btn:hover { color: #f59e0b; }
    </style>
</head>
<body class="antialiased bg-main text-light">

    <!-- ================= HEADER LOADER ================= -->
    <div id="header-container"></div>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="max-w-7xl mx-auto px-4 py-16">
        
        <!-- Page Title -->
        <div class="text-center mb-16">
            <span class="bg-white/10 border border-gold/30 text-gold px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wider">फोटो एल्बम</span>
            <h1 class="text-4xl sm:text-5xl font-bold text-gold mt-4 mb-4">गौशाला गैलरी</h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">हमारी गौशाला में सेवा, स्नेह और नंदी महाराज की कुछ प्यारी तस्वीरें।</p>
        </div>

        <!-- Gallery Grid -->
        <!-- यहाँ आप अपनी असली तस्वीरों के नाम (जैसे ngl1.jpg) डाल सकते हैं -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- Photo 1 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Nandi+Maharaj')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Nandi+Maharaj" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 2 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Cow+Shelter')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Cow+Shelter" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 3 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Green+Fodder')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Green+Fodder" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 4 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Medical+Care')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Medical+Care" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 5 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Gaushala+View')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Gaushala+View" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 6 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Seva+Time')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Seva+Time" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 7 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Nandi+Baba')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Nandi+Baba" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

            <!-- Photo 8 -->
            <div class="bg-card p-2 rounded-xl border border-custom shadow-lg group cursor-pointer" onclick="openLightbox('https://via.placeholder.com/800x600?text=Gaushala+Team')">
                <div class="overflow-hidden rounded-lg h-64">
                    <img src="https://via.placeholder.com/400x300?text=Gaushala+Team" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" alt="Gaushala Image">
                </div>
            </div>

        </div>
    </main>

    <!-- ================= LIGHTBOX (Popup Image) ================= -->
    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Image">
    </div>

    <!-- ================= FOOTER LOADER ================= -->
    <div id="footer-container"></div>

    <!-- ================= SCRIPTS ================= -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>

    <!-- Lightbox Logic -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        // फोटो खोलने का फंक्शन
        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // स्क्रॉल रोकें
        }

        // फोटो बंद करने का फंक्शन
        function closeLightbox() {
            lightbox.style.display = 'none';
            document.body.style.overflow = 'auto'; // स्क्रॉल चालू करें
        }
    </script>
</body>
</html>
