<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल - नंदी गौशाला लछारसर</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { background-color: #f1f5f9; font-family: 'Poppins', sans-serif; color: #1e293b; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="max-w-5xl w-full glass-panel rounded-2xl overflow-hidden border border-gray-200">
        
        <div class="bg-gradient-to-r from-orange-600 to-amber-500 p-6 text-white text-center relative">
            <h1 class="text-3xl font-bold"><i class="fas fa-shield-alt mr-2"></i> एडमिन पैनल</h1>
            <p class="text-orange-100 mt-2 font-medium">नंदी गौशाला, लछारसर</p>
            <a href="index.html" class="absolute top-6 right-6 text-sm bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg transition hidden sm:block">
                <i class="fas fa-external-link-alt"></i> वेबसाइट देखें
            </a>
        </div>

        <div class="p-6 md:p-10">
            
            <!-- लॉगिन सेक्शन -->
            <div id="login-section" class="text-center py-12">
                <div class="text-6xl text-gray-300 mb-6"><i class="fas fa-user-lock"></i></div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">सुरक्षित लॉगिन</h2>
                <p class="text-gray-500 mb-8">कृपया अपने अधिकृत Google अकाउंट से लॉगिन करें</p>
                
                <button id="loginBtn" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold text-lg hover:bg-blue-700 transition shadow-lg flex items-center justify-center gap-3 mx-auto">
                    <i class="fab fa-google"></i> Google से लॉगिन करें
                </button>
                <p id="login-msg" class="text-red-500 mt-4 text-sm font-bold"></p>
            </div>

            <!-- एडमिन पैनल (लॉगिन के बाद) -->
            <div id="admin-section" class="hidden">
                
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl mb-8 border border-gray-200">
                    <div class="flex items-center gap-3 text-gray-700 font-medium">
                        <i class="fas fa-check-circle text-green-500 text-xl"></i>
                        <span id="user-email"></span>
                    </div>
                    <button id="logoutBtn" class="text-red-500 font-bold hover:text-red-700 transition flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>

                <!-- 3 टैब्स (कंटेंट, दान, संपर्क) -->
                <div class="flex flex-wrap border-b border-gray-200 mb-8">
                    <button id="tab-content" class="px-6 py-3 font-bold text-orange-600 border-b-2 border-orange-600 transition">
                        <i class="fas fa-edit"></i> कंटेंट
                    </button>
                    <button id="tab-donations" class="px-6 py-3 font-bold text-gray-500 hover:text-gray-800 transition">
                        <i class="fas fa-hand-holding-usd"></i> दान लिस्ट
                    </button>
                    <button id="tab-messages" class="px-6 py-3 font-bold text-gray-500 hover:text-gray-800 transition">
                        <i class="fas fa-envelope"></i> संपर्क संदेश
                    </button>
                </div>

                <!-- टैब 1: कंटेंट -->
                <div id="content-tab">
                    <form id="adminForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">नोटिस (पॉपअप में दिखेगा)</label>
                            <textarea id="noticeInput" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 focus:ring-2 focus:ring-orange-500 outline-none transition"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">समाचार (होम पेज पर दिखेगा)</label>
                            <textarea id="contentInput" rows="6" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 focus:ring-2 focus:ring-orange-500 outline-none transition"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-md">
                            <i class="fas fa-paper-plane mr-2"></i> वेबसाइट पर पब्लिश करें
                        </button>
                        <p id="save-msg" class="text-center font-bold"></p>
                    </form>
                </div>

                <!-- टैब 2: दान लिस्ट -->
                <div id="donations-tab" class="hidden">
                    <div class="overflow-x-auto rounded-xl border border-gray-200">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 text-gray-700 font-bold">
                                <tr>
                                    <th class="p-4 border-b">दिनांक</th>
                                    <th class="p-4 border-b">दानकर्ता का नाम</th>
                                    <th class="p-4 border-b">राशि (₹)</th>
                                    <th class="p-4 border-b">संदेश</th>
                                </tr>
                            </thead>
                            <tbody id="donations-list" class="text-gray-600"></tbody>
                        </table>
                    </div>
                </div>

                <!-- टैब 3: संपर्क संदेश -->
                <div id="messages-tab" class="hidden">
                    <div class="overflow-x-auto rounded-xl border border-gray-200">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 text-gray-700 font-bold">
                                <tr>
                                    <th class="p-4 border-b">दिनांक</th>
                                    <th class="p-4 border-b">प्रेषक (नाम/फोन)</th>
                                    <th class="p-4 border-b">संदेश</th>
                                </tr>
                            </thead>
                            <tbody id="messages-list" class="text-gray-600"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
