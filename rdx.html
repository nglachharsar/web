<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>प्रीमियम एडमिन पैनल - नंदी गौशाला</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Poppins', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div class="max-w-4xl w-full glass-panel rounded-2xl shadow-2xl border border-gray-100 overflow-hidden">
        <div class="bg-gradient-to-r from-orange-600 to-amber-500 p-6 text-white text-center">
            <h1 class="text-3xl font-bold"><i class="fas fa-shield-alt mr-2"></i> एडमिन पैनल</h1>
            <p class="text-orange-100 mt-2">नंदी गौशाला, लछारसर</p>
        </div>

        <div class="p-6 md:p-10">
            <div id="login-section" class="text-center py-10">
                <div class="text-6xl text-gray-300 mb-6"><i class="fas fa-user-lock"></i></div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">सुरक्षित लॉगिन</h2>
                <p class="text-gray-500 mb-8">कृपया अपने अधिकृत Google अकाउंट से लॉगिन करें</p>
                <button id="loginBtn" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold text-lg hover:bg-blue-700 transition shadow-lg flex items-center justify-center gap-3 mx-auto">
                    <i class="fab fa-google"></i> Google से लॉगिन करें
                </button>
                <p id="login-msg" class="text-red-500 mt-4 text-sm font-bold"></p>
            </div>

            <div id="admin-section" class="hidden">
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl mb-8 border border-gray-200">
                    <div class="flex items-center gap-3 text-gray-700 font-medium">
                        <i class="fas fa-check-circle text-green-500 text-xl"></i>
                        <span id="user-email"></span>
                    </div>
                    <button id="logoutBtn" class="text-red-500 font-bold hover:text-red-700 transition"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>

                <div class="flex border-b border-gray-200 mb-8">
                    <button id="tab-content" class="px-6 py-3 font-bold text-orange-600 border-b-2 border-orange-600 transition"><i class="fas fa-edit"></i> कंटेंट</button>
                    <button id="tab-donations" class="px-6 py-3 font-bold text-gray-500 hover:text-gray-800 transition"><i class="fas fa-hand-holding-usd"></i> दान लिस्ट</button>
                </div>

                <div id="content-tab">
                    <form id="adminForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">नोटिस (पॉपअप में दिखेगा)</label>
                            <textarea id="noticeInput" rows="3" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 focus:ring-2 focus:ring-orange-500 outline-none transition"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">समाचार (होम पेज पर दिखेगा)</label>
                            <textarea id="contentInput" rows="6" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 focus:ring-2 focus:ring-orange-500 outline-none transition"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-md">वेबसाइट पर पब्लिश करें</button>
                        <p id="save-msg" class="text-center font-bold"></p>
                    </form>
                </div>

                <div id="donations-tab" class="hidden">
                    <div class="overflow-x-auto rounded-xl border border-gray-200">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-100 text-gray-700 font-bold">
                                <tr>
                                    <th class="p-4 border-b">दिनांक</th>
                                    <th class="p-4 border-b">नाम</th>
                                    <th class="p-4 border-b">राशि (₹)</th>
                                    <th class="p-4 border-b">संदेश</th>
                                </tr>
                            </thead>
                            <tbody id="donations-list" class="text-gray-600"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
